name: CI Pipeline

on:
  push:
    branches: ["*"]
  pull_request:
    branches: ["*"]

jobs:
  test:
    runs-on: [linux-amd64]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          cache: false
          go-version: "1.26"

      - name: Download dependencies
        run: go mod download

      - name: Run unit tests
        run: go test -v -race ./...

      - name: Build
        run: |
          CGO_ENABLED=0 go build -v ./cmd/kmsd
          CGO_ENABLED=0 go build -v ./cmd/kms
