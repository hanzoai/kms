name: Release

# Multi-arch release pipeline triggered by semver tags.
#
# Produces:
#   * kms-{linux,darwin}-{amd64,arm64}    — admin CLI (cmd/kms)
#   * kmsd-{linux,darwin}-{amd64,arm64}   — server daemon (cmd/kmsd)
#   * ghcr.io/hanzoai/kms:vX.Y.Z           — multi-arch manifest
#
# Uses GitHub-hosted runners exclusively (ubuntu-24.04 / ubuntu-24.04-arm /
# macos-14 / macos-14). The legacy backend/ kms-core binaries are still
# produced by build-binaries.yml — this workflow only covers the Go CLI
# + daemon.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v1.0.0). Must already exist.'
        required: true
        type: string

permissions:
  contents: write
  packages: write
  id-token: write

jobs:
  binaries:
    name: Build binaries (${{ matrix.goos }}/${{ matrix.goarch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            runner: hanzo-build-linux-amd64
          - goos: linux
            goarch: arm64
            runner: ubuntu-24.04-arm
          - goos: darwin
            goarch: amd64
            runner: macos-14
          - goos: darwin
            goarch: arm64
            runner: macos-14
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Resolve version
        id: version
        run: |
          ref="${{ inputs.tag || github.ref_name }}"
          echo "tag=${ref}" >> "$GITHUB_OUTPUT"

      - name: Build kms + kmsd (${{ matrix.goos }}/${{ matrix.goarch }})
        env:
          CGO_ENABLED: '0'
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          GOEXPERIMENT: jsonv2
          VERSION: ${{ steps.version.outputs.tag }}
          # luxfi (+ hanzoai) modules are first-party/private: resolve them
          # directly via git and skip the public checksum DB — force-moved
          # upstream tags never match sum.golang.org. GH_PAT carries luxfi read
          # access; the repo GITHUB_TOKEN is the fallback for public modules.
          GOPRIVATE: github.com/luxfi/*,github.com/hanzoai/*
          GONOSUMDB: github.com/luxfi/*,github.com/hanzoai/*
          GH_PAT: ${{ secrets.GH_PAT }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          token="${GH_PAT:-$GITHUB_TOKEN}"
          if [ -n "$token" ]; then
            git config --global url."https://x-access-token:${token}@github.com/".insteadOf "https://github.com/"
          fi
          mkdir -p dist
          go build -trimpath \
            -ldflags="-s -w -X main.version=${VERSION}" \
            -o "dist/kms-${GOOS}-${GOARCH}" ./cmd/kms
          go build -trimpath \
            -ldflags="-s -w -X main.version=${VERSION}" \
            -o "dist/kmsd-${GOOS}-${GOARCH}" ./cmd/kmsd
          # shasum is available on both linux and macos runners
          (cd dist && shasum -a 256 "kms-${GOOS}-${GOARCH}" "kmsd-${GOOS}-${GOARCH}" \
            > "kms-${GOOS}-${GOARCH}.sha256")

      # v3, not v4+: this workflow runs on git.hanzo.ai, which presents as GHES.
      # The v4 action refuses outright — "GHESNotSupportedError: @actions/artifact
      # v2.0.0+ ... not currently supported on GHES" — so the job builds its
      # artifact and then discards it at the last step, and reads as a build
      # failure when the build actually succeeded.
      - uses: actions/upload-artifact@v3
        with:
          name: binaries-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  github-release:
    name: GitHub Release
    needs: [binaries]
    runs-on: hanzo-build-linux-amd64
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0

      # v3, not v4+: this workflow runs on git.hanzo.ai, which presents as GHES.
      # The v4 action refuses outright — "GHESNotSupportedError: @actions/artifact
      # v2.0.0+ ... not currently supported on GHES" — so the job builds its
      # artifact and then discards it at the last step, and reads as a build
      # failure when the build actually succeeded.
      - uses: actions/download-artifact@v3
        with:
          path: dist
          merge-multiple: true

      - name: Resolve version
        id: version
        run: |
          ref="${{ inputs.tag || github.ref_name }}"
          echo "tag=${ref}" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          # generate_release_notes is NOT set: it makes the action call
          #   POST <api>/repos/<o>/<r>/releases/generate-notes
          # which is a GitHub-only endpoint. This forge does not route it and
          # answers Go's bare `404 page not found`, which the action surfaces
          # verbatim as `::error::404 page not found`. Everything builds, and
          # then the release step alone fails -- so the run reads as a release
          # problem when it is one unsupported flag.
          files: |
            dist/kms-linux-amd64
            dist/kms-linux-arm64
            dist/kms-darwin-amd64
            dist/kms-darwin-arm64
            dist/kmsd-linux-amd64
            dist/kmsd-linux-arm64
            dist/kmsd-darwin-amd64
            dist/kmsd-darwin-arm64
            dist/kms-linux-amd64.sha256
            dist/kms-linux-arm64.sha256
            dist/kms-darwin-amd64.sha256
            dist/kms-darwin-arm64.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docker:
    name: Multi-arch Docker (ghcr.io/hanzoai/kms)
    needs: [binaries]
    runs-on: hanzo-build-linux-amd64
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Resolve version
        id: version
        run: |
          ref="${{ inputs.tag || github.ref_name }}"
          echo "tag=${ref}" >> "$GITHUB_OUTPUT"
          echo "semver=${ref#v}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      # ghcr.io wants a GitHub credential, and this job runs on a hanzo
      # self-hosted pool -- so `secrets.GITHUB_TOKEN` is git.hanzo.ai's token,
      # which ghcr.io has never seen (`denied: denied`). orgs/hanzoai provisions
      # GHCR_USER + GHCR_TOKEN; naming them directly rather than through a `||`
      # chain, because a missing org secret is "" and the fallback then swaps
      # credentials without saying so.
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ secrets.GHCR_USER }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Build and push multi-arch image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          provenance: false
          push: true
          tags: |
            ghcr.io/hanzoai/kms:${{ steps.version.outputs.tag }}
            ghcr.io/hanzoai/kms:${{ steps.version.outputs.semver }}
            ghcr.io/hanzoai/kms:latest
          build-args: |
            GO_EXPERIMENT=jsonv2
            GITHUB_TOKEN=${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
          # Registry cache, not type=gha: git.hanzo.ai issues no Actions runtime
          # token buildx can parse, and the exporter is configured during the
          # solve, so type=gha fails the BUILD instead of skipping the cache.
          cache-from: type=registry,ref=ghcr.io/hanzoai/kms:buildcache,ignore-error=true
          cache-to: type=registry,ref=ghcr.io/hanzoai/kms:buildcache,mode=max,ignore-error=true
  notify-universe:
    name: Notify universe (auto-bump pin)
    needs: [docker]
    runs-on: hanzo-build-linux-amd64
    if: github.repository == 'hanzoai/kms'
    continue-on-error: true
    steps:
      - name: Resolve version
        id: version
        run: |
          ref="${{ inputs.tag || github.ref_name }}"
          echo "tag=${ref}" >> "$GITHUB_OUTPUT"

      - name: Repository dispatch
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.UNIVERSE_DISPATCH_TOKEN }}
          repository: hanzoai/universe
          event-type: kms
          client-payload: |
            {
              "service": "kms",
              "version": "${{ steps.version.outputs.tag }}",
              "image":   "ghcr.io/hanzoai/kms:${{ steps.version.outputs.tag }}",
              "sha":     "${{ github.sha }}"
            }
